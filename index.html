<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#070b16" />
    <title>Aida — coming soon</title>
    <meta name="description" content="Aida is on her way. Tap to hear her say hello." />
    <meta property="og:title" content="Aida — coming soon" />
    <meta property="og:description" content="Aida is on her way. Tap to hear her say hello." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div class="scene" id="scene">
      <div class="glow" aria-hidden="true"></div>
      <div class="rays" aria-hidden="true"></div>
      <div class="grain" aria-hidden="true"></div>

      <main class="stage">
        <h1 class="title" aria-label="Hello. I'm Aida.">
          <span class="line line-hello" aria-hidden="true"><span class="word" data-split>Hello.</span></span>
          <span class="line line-name" aria-hidden="true"
            ><span class="word im" data-split>I&rsquo;m</span> <span class="word name" data-split>Aida.</span></span
          >
          <span class="sweep" aria-hidden="true"></span>
        </h1>

        <p class="soon">Coming soon</p>

        <div class="controls">
          <button class="cta" id="meet" type="button" data-state="idle">
            <span class="cta-icon" aria-hidden="true">
              <svg class="icon-play" viewBox="0 0 24 24" width="18" height="18" focusable="false">
                <path d="M8 5.5v13l10.5-6.5z" fill="currentColor" />
              </svg>
              <span class="icon-bars"><i></i><i></i><i></i><i></i></span>
            </span>
            <span class="cta-label" id="meet-label">Hear her say hello</span>
          </button>
        </div>

        <p class="spoken" id="spoken" aria-live="polite" aria-atomic="true"></p>

        <audio id="voice" preload="none">
          <source src="/audio/intro.webm" type="audio/webm; codecs=opus" />
          <source src="/audio/intro.mp3" type="audio/mpeg" />
        </audio>
      </main>

      <footer class="foot">
        <p>&copy; 2026 Aida</p>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
